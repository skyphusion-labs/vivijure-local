version: 2

# skyphusion-labs Dependabot standard — see fleet-chezmoi/docs/runbooks/dependabot-standard.md
# PRs only (never auto-merge). Group minor/patch; majors stay separate. Peer families bump together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      cloudflare-toolchain:
        patterns:
          - "wrangler"
          - "@cloudflare/workers-types"
      vitest-toolchain:
        patterns:
          - "vitest"
          - "@vitest/*"
      hono-runtime:
        patterns:
          - "hono"
          - "@hono/node-server"
      vivijure-contract:
        patterns:
          - "@skyphusion-labs/vivijure-core"
          - "@skyphusion-labs/vivijure-mcp"
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "wrangler"
          - "@cloudflare/workers-types"
          - "vitest"
          - "@vitest/*"
          - "hono"
          - "@hono/node-server"
          - "@skyphusion-labs/vivijure-core"
          - "@skyphusion-labs/vivijure-mcp"
        update-types: ["minor", "patch"]
  # Docker, split into TWO entries on purpose (vivijure-local#243 fallout).
  #
  # image-prep and audio-beat-sync cannot move off python 3.11: both reach numba (via rembg ->
  # pymatting and via librosa) which supports only >=3.10,<3.14, both hardcode the python3.11
  # site-packages path in their numba-cache warm step, and audio-beat-sync additionally pins
  # numpy==1.26.4 which publishes no cp314 wheel. Each Dockerfile SAID so in a comment, and it was
  # bumped to 3.14 anyway inside a grouped update, because dependabot does not read prose. The tag
  # bake then failed on both images.
  #
  # An `ignore` scoped to those two directories is the enforceable form of that constraint. It is
  # NOT a blanket freeze: patch/digest refreshes still flow, and every OTHER container keeps taking
  # python updates through the entry below (audio-master and audio-mix have run 3.14 since
  # 2026-07-15, and video-finish builds clean on it, so there is nothing to hold them back for).
  - package-ecosystem: docker
    directories:
      - "/containers/audio-beat-sync"
      - "/containers/image-prep"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      docker-images-numba-pinned:
        patterns: ["*"]
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  - package-ecosystem: docker
    directories:
      - "/"
      - "/containers/audio-master"
      - "/containers/audio-mix"
      - "/containers/video-finish"
      - "/reverse-proxy"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      docker-images:
        patterns: ["*"]
