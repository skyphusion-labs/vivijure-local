version: 2

# skyphusion-labs Dependabot standard -- see fleet-chezmoi/docs/runbooks/dependabot-standard.md
# PRs only (never auto-merge). Group minor/patch; majors stay separate. Peer families bump together.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      cloudflare-toolchain:
        patterns:
          - "wrangler"
          - "@cloudflare/workers-types"
      vitest-toolchain:
        patterns:
          - "vitest"
          - "@vitest/*"
      hono-runtime:
        patterns:
          - "hono"
          - "@hono/node-server"
      vivijure-contract:
        patterns:
          - "@skyphusion-labs/vivijure-core"
          - "@skyphusion-labs/vivijure-mcp"
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns:
          - "wrangler"
          - "@cloudflare/workers-types"
          - "vitest"
          - "@vitest/*"
          - "hono"
          - "@hono/node-server"
          - "@skyphusion-labs/vivijure-core"
          - "@skyphusion-labs/vivijure-mcp"
        update-types: ["minor", "patch"]
  # Docker, split on purpose (vivijure-local#243 fallout + local#316).
  #
  # image-prep and audio-beat-sync cannot move off python 3.11: both reach numba (via rembg ->
  # pymatting and via librosa) which supports only >=3.10,<3.14, both hardcode the python3.11
  # site-packages path in their numba-cache warm step, and audio-beat-sync additionally pins
  # numpy==1.26.4 which publishes no cp314 wheel. Each Dockerfile SAID so in a comment, and it was
  # bumped to 3.14 anyway inside a grouped update, because dependabot does not read prose. The tag
  # bake then failed on both images. An `ignore` is the enforceable form of that constraint.
  - package-ecosystem: docker
    directories:
      - "/containers/audio-beat-sync"
      - "/containers/image-prep"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      docker-images-numba-pinned:
        patterns: ["*"]
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # video-finish is PINNED TO 3.11 for dual-panel interpreter parity with vivijure-cf (local#316).
  # 3.14 builds clean here (no numba), but nothing requires it; cf stays on 3.11. Patch/digest
  # refreshes still flow; major/minor python bumps are ignored until the pin is deliberately
  # lifted on BOTH doors together.
  - package-ecosystem: docker
    directories:
      - "/containers/video-finish"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      docker-images-video-finish-cf-parity:
        patterns: ["*"]
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Unconstrained containers keep taking python (and other base) updates.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/containers/audio-master"
      - "/containers/audio-mix"
      - "/reverse-proxy"
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      docker-images:
        patterns: ["*"]
