name: containers-drift

# Fail when containers/{video-finish,image-prep,audio-beat-sync,audio-mix,audio-master}
# drift from vivijure-cf without an intentional, documented delta (local#314).
#
# Sibling of manifest-drift.yml: that job guards dev/manifests/*.json; this one guards
# the CPU media build contexts. scripts/sync-containers.sh is the repair path; this is
# the CI hook that makes a silent rsync-skip fail the PR.
#
# THE REF STILL FLOATS, DELIBERATELY (local#482, and it is the whole design).
#
# This is a PARITY guard: its subject is "does this repo's mirror still match cf", which
# is a property of cf and of main, not of any pull request. local#362 proposed greening
# the sibling parity guard by pinning cf to a sha at which the fixtures still matched.
# That was REFUSED and local#403 merged the opposite, for a reason that applies here
# unchanged: a pin "does not fix the gap; it selects a reference point where the gap is
# invisible, and the guard then stops being able to go red on the thing it exists for".
# dev/cf-quality-tier-pin says the same from the other side -- that pin is explicitly
# NOT for this job, because this job tracks cf main on purpose.
#
# WHAT WAS ACTUALLY BROKEN (local#482) WAS NOT THE REF. IT WAS THE TRIGGER.
#
# Asserting a parity fact on the pull_request path makes every open PR a hostage to the
# other repo: six cf dependency bumps landed in twelve minutes on 2026-10-20 and redded
# PR #481, whose diff never opens any guarded path. The author cannot fix that without
# hand-copying another repo's dependency bumps into an unrelated diff.
#
# cf-pin-staleness.yml already wrote this doctrine down for the other cross-repo
# assertion: a gate on the pull_request path "would red every open local PR the moment
# cf merges ... So this runs on a schedule and on demand. When it goes red, nobody's PR
# is blocked." This job now follows it, WITHOUT taking the pin half:
#
#   pull_request  -- only when the PR actually edits a guarded path or this guard itself.
#                    Those PRs are gated against CURRENT cf, so the guard keeps its teeth
#                    exactly where an author can honestly answer for the diff.
#   push to main  -- unchanged. Parity is re-measured on every merge.
#   schedule      -- NEW. This is what keeps the subject alive: cf drift is caught within
#                    a day whether or not anyone opens a PR, against floating main, and
#                    the red blocks nobody. The remedy is a deliberate sync PR, which is
#                    local#403's "absorb it", not a pin around it.
#
# The paths list below is scoped to the FIVE DIRECTORIES scripts/check-containers-drift.sh
# actually compares, not to containers/**. That distinction is load-bearing and measured:
# PR #481 edits containers/cast-image/**, which this guard does not watch, so a
# containers/** filter would not have unblocked it. Keep this list in step with DIRS in
# scripts/check-containers-drift.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'containers/video-finish/**'
      - 'containers/image-prep/**'
      - 'containers/audio-beat-sync/**'
      - 'containers/audio-mix/**'
      - 'containers/audio-master/**'
      - 'scripts/check-containers-drift.sh'
      - 'scripts/sync-containers.sh'
      - '.github/workflows/containers-drift.yml'
  schedule:
    # Daily. cf merges container dependency bumps in bursts; hourly would be noise and
    # the remedy (a deliberate sync PR) is not something anyone does more than once a day.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # event_name is in the group on purpose: without it a scheduled run and a push to main
  # share refs/heads/main, and cancel-in-progress would have them cancel each other.
  group: containers-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: vivijure-local

      - uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-cf
          # FLOATING ON PURPOSE (local#403 / local#482). Do not replace this with a pin
          # to green a red run: a pin selects a reference point at which the gap is
          # invisible. If this is red with no change on this side, cf moved and the drift
          # is REAL -- absorb it with `npm run sync-containers` in a deliberate PR.
          ref: main
          path: vivijure-local/.upstream/vivijure

      - name: Diff containers/ against vivijure-cf (allowlisted deltas pin-tested)
        working-directory: vivijure-local
        run: bash scripts/check-containers-drift.sh .upstream/vivijure
