name: containers-drift

# Fail when containers/{video-finish,image-prep,audio-beat-sync,audio-mix,audio-master}
# drift from vivijure-cf without an intentional, documented delta (local#314).
#
# Sibling of manifest-drift.yml: that job guards dev/manifests/*.json; this one guards
# the CPU media build contexts. scripts/sync-containers.sh is the repair path; this is
# the CI hook that makes a silent rsync-skip fail the PR.
#
# THE REF STILL FLOATS, DELIBERATELY (local#482, and it is the whole design).
#
# This is a PARITY guard: its subject is "does this repo's mirror still match cf", which
# is a property of cf and of main, not of any pull request. local#362 proposed greening
# the sibling parity guard by pinning cf to a sha at which the committed manifests still
# matched. That was REFUSED and local#403 merged the opposite, for a reason that applies
# here unchanged: a pin "does not fix the gap; it selects a reference point where the gap
# is invisible, and the guard then stops being able to go red on the thing it exists for".
# dev/cf-quality-tier-pin says the same from the other side -- that pin is explicitly NOT
# for this job, because this job tracks cf main on purpose.
#
# WHAT WAS ACTUALLY BROKEN (local#482) WAS NOT THE REF. IT WAS THE SCOPE.
#
# Asserting a parity fact against every pull request makes every open PR a hostage to the
# other repo: six cf dependency bumps landed in twelve minutes on 2026-10-20 and redded
# PR #481, whose diff never opens any guarded path. The author cannot answer for that
# without hand-copying another repo's dependency bumps into an unrelated diff.
#
# cf-pin-staleness.yml already wrote this doctrine down for the other cross-repo
# assertion: a gate on the pull_request path "would red every open local PR the moment cf
# merges ... So this runs on a schedule and on demand. When it goes red, nobody's PR is
# blocked." This job now follows it, WITHOUT taking the pin half.
#
# WHY THE SCOPING IS IN THE JOB AND NOT IN AN `on.pull_request.paths:` FILTER.
# A paths filter makes the job not run at all, which reports NO status. If this check is
# ever a required one, a PR it skips sits forever on "Expected -- waiting for status",
# which is the stranded-required-check trap. Deciding inside the job means the
# containers-drift status is ALWAYS reported, so the scoping cannot strand anything, and
# the choice stays correct whether or not this check is required today. The skip is
# printed loudly and written to the job summary rather than passing quietly, because a
# job that reports success without having compared anything must say so.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily. This is what keeps the subject alive: cf drift is caught within a day whether
    # or not anyone opens a PR, against floating main, and the red blocks nobody. The
    # remedy is a deliberate sync PR, which is local#403's "absorb it", not a pin.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # event_name is in the group on purpose: without it a scheduled run and a push to main
  # share refs/heads/main, and cancel-in-progress would have them cancel each other.
  group: containers-drift-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: vivijure-local

      - name: Decide whether this event can speak to container parity
        id: decide
        working-directory: vivijure-local
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Keep this list in step with DIRS in scripts/check-containers-drift.sh.
          # It is the five guarded directories plus this guard's own files, NOT
          # containers/**: containers/ holds unguarded dirs too (cast-image), and a
          # containers/** filter would re-run this on PRs it cannot speak to. That is
          # measured, not assumed -- PR #481 edits containers/cast-image/** only.
          WATCHED='^(containers/(video-finish|image-prep|audio-beat-sync|audio-mix|audio-master)/|scripts/check-containers-drift\.sh$|scripts/sync-containers\.sh$|\.github/workflows/containers-drift\.yml$)'

          if [[ "$EVENT" != "pull_request" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=event=$EVENT compares the whole mirror against cf main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # CONTROL FIRST: an empty or errored file list must not read as "nothing
          # watched changed", which is the reassuring answer. A PR always has >= 1 file.
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename')
          count=$(printf '%s\n' "$files" | grep -c . || true)
          if [[ "$count" -lt 1 ]]; then
            echo "local#482: read 0 changed files for PR #${PR}; refusing to infer a skip from an empty list." >&2
            exit 1
          fi
          echo "local#482: PR #${PR} changed ${count} file(s)"

          hits=$(printf '%s\n' "$files" | grep -E "$WATCHED" || true)
          hit_count=$(printf '%s\n' "$hits" | grep -c . || true)

          if [[ "$hit_count" -gt 0 ]]; then
            echo "local#482: ${hit_count} watched path(s) changed; comparing against cf main:"
            printf '  %s\n' $hits
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=${hit_count} watched path(s) in this PR" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=none of ${count} changed file(s) is a watched path" >> "$GITHUB_OUTPUT"
          fi

      - name: Report a skip loudly (this job did NOT compare anything)
        if: steps.decide.outputs.run != 'true'
        run: |
          set -euo pipefail
          echo "=================================================================="
          echo "containers-drift DID NOT COMPARE. This green means NOT CHECKED."
          echo "  reason: ${{ steps.decide.outputs.reason }}"
          echo ""
          echo "Container parity against vivijure-cf is a property of main and of cf,"
          echo "not of this pull request, so this PR is not asked to answer for it."
          echo "It is measured on every push to main and daily on a schedule (local#482)."
          echo "=================================================================="
          {
            echo "### containers-drift: skipped, nothing compared"
            echo ""
            echo "- **This green means NOT CHECKED**, not \"no drift\"."
            echo "- Reason: ${{ steps.decide.outputs.reason }}"
            echo "- Parity against vivijure-cf is measured on push to \`main\` and daily (local#482)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: steps.decide.outputs.run == 'true'
        with:
          repository: skyphusion-labs/vivijure-cf
          # FLOATING ON PURPOSE (local#403 / local#482). Do not replace this with a pin
          # to green a red run: a pin selects a reference point at which the gap is
          # invisible. If this is red with no change on this side, cf moved and the drift
          # is REAL -- absorb it with `npm run sync-containers` in a deliberate PR.
          ref: main
          path: vivijure-local/.upstream/vivijure

      - name: Diff containers/ against vivijure-cf (allowlisted deltas pin-tested)
        if: steps.decide.outputs.run == 'true'
        working-directory: vivijure-local
        run: |
          echo "containers-drift: comparing ($(echo '${{ steps.decide.outputs.reason }}'))"
          bash scripts/check-containers-drift.sh .upstream/vivijure
