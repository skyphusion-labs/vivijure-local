name: coverage

# ESTATE `coverage` workflow (fc#2279). Edit THIS template, then re-point the copies.
# Test: .github/scripts/tests/coverage-standard.test.sh (drives the run block below).
#
# Provides the `coverage` context the org ruleset requires. It replaces the old estate
# coverage.yml, which could not go red:
#   1. It chose what to run with `npm run --silent | grep -qE '^  coverage'`. On npm 10
#      (Node 22) `npm run --silent` with no script name prints NOTHING, so both greps
#      failed and every repo fell through to an echo and passed. Measured fc#2279.
#   2. The no-manifest branch also echoed and passed.
#
# This version reads scripts from package.json directly and has NO silent-pass branch.
# Every green run prints exactly one line starting `coverage-standard: EXECUTED` or
# `coverage-standard: EXEMPT (declared)`; classify a run by that executed line, never by
# the run: text (GitHub prints the whole body into the log whether or not a branch ran).
#
# Outcomes:
#   package.json with a `coverage` script -> npm run coverage
#   package.json with a `test` script     -> npm test
#   package.json with neither             -> FAIL (add a test, or declare an exemption)
#   go.mod                                -> go test ./... -cover
#   no manifest at all                    -> FAIL (add a test, or declare an exemption)
# Exemption: .github/coverage-exempt, whose content is the reason (>= 40 characters). It is
# an explicit, reviewable file, never a silent fallthrough. It applies only when nothing
# above is runnable; a repo that has a runnable target is measured, not exempted.
#
# Does NOT use actions/upload-code-coverage (paid Code Quality).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: vivijure-local
          persist-credentials: false

      - name: Checkout vivijure-core
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-core
          path: vivijure-core
          # local CI runs core's OWN suite, which includes a guard comparing package.json
          # against the `vivijure-core-v*` tags. Without tags that guard sees an empty tag
          # set and REFUSES rather than passing -- correctly, because a tag comparison with
          # no tags is a vacuous green. The refusal is the guard working; the missing tags
          # were ours. Its message says so in terms: "CI must fetch-tags and local clones
          # need git fetch --tags or this guard is a vacuous green".
          #
          # This is the same class as local#295 / local#313 arriving through the CORE
          # sibling checkout rather than through vivijure-cf: a change in another repo
          # reddens every PR here with no change on this side. It is not a pin, because the
          # remedy is giving the guard its inputs, not freezing the repo it lives in.
          fetch-tags: true
          fetch-depth: 0
      - name: Read vivijure-cf pin (quality-tier-drift only)
        id: cf_pin
        working-directory: vivijure-local
        run: |
          set -euo pipefail
          pin_file=dev/cf-quality-tier-pin
          if [[ ! -f "$pin_file" ]]; then
            echo "local#295: missing $pin_file -- quality-tier-drift needs a deliberate cf pin" >&2
            exit 1
          fi
          sha=$(grep -E '^SHA=' "$pin_file" | head -1 | cut -d= -f2- | tr -d '[:space:]')
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "local#295: $pin_file must set SHA=<40-char lowercase hex>; got: ${sha:-<empty>}" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "local#295: quality-tier-drift will use vivijure-cf@$sha (not floating main)"
      - name: Checkout vivijure-cf (quality-tier-drift module manifests)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-cf
          # PINNED (local#295). Do not change to main/branch without updating
          # dev/cf-quality-tier-pin in the same commit. Floating main is how an
          # unrelated cf merge reds every local PR with no signal on the cf side.
          ref: ${{ steps.cf_pin.outputs.sha }}
          path: vivijure
          # Whole modules/ tree (cone mode), not a hand-listed subset. A path list
          # that must stay in sync with cf's relative imports is the class that
          # reded every local PR when cf#280 added modules/_shared (local#295).
          # Checking out modules/ removes that enumeration; a pin removes the
          # "floating main" half. Class is not fully gone until the guard reads
          # MANIFEST as data rather than importing module entrypoints (see issue
          # analysis on #295 / vivijure-core) -- this is the local-side fix.
          #
          # `migrations` is a SEPARATE top-level cone entry, not a module import.
          # vivijure-core's tests/helpers/d1-sqlite.ts (cfMigrationsDir()) reads
          # vivijure/migrations/0001_init.sql at test time to build a real SQLite
          # facade for the renders-db suite; it is a DATA FILE dependency of that
          # test, never something any module's src imports. A checkout missing it
          # fails with "vivijure-cf migrations not found (looked for 0001_init.sql
          # in: ...)" thrown by cfMigrationsDir() itself, NOT ERR_MODULE_NOT_FOUND --
          # a distinct signature worth recognising before assuming this list only
          # has to track module import graphs. Before trimming this entry, grep
          # vivijure-core for cfMigrationsDir() and confirm nothing still needs it.
          sparse-checkout: |
            modules
            migrations
          sparse-checkout-cone-mode: true
      - name: Preflight quality-tier cf checkout (local#295)
        run: |
          set -euo pipefail
          # Fail with a message that names the coupling, not ERR_MODULE_NOT_FOUND
          # buried inside a vitest import graph hours later on an unrelated PR.
          root=vivijure/modules
          need=(
            keyframe/src/index.ts
            own-gpu/src/index.ts
          )
          missing=0
          for rel in "${need[@]}"; do
            if [[ ! -f "$root/$rel" ]]; then
              echo "local#295: pinned vivijure-cf checkout is missing modules/$rel" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "local#295: quality-tier-drift imports MANIFEST from those entrypoints via vivijure-core." >&2
            echo "local#295: pin file: vivijure-local/dev/cf-quality-tier-pin  workflow: .github/workflows/ci.yml" >&2
            echo "local#295: bump the pin deliberately, or fix the sparse checkout; do not leave this red on unrelated PRs." >&2
            exit 1
          fi
          # Surface relative imports that escape the module dir so the next miss
          # is visible here (with this issue id) rather than as a bare module-not-found.
          while IFS= read -r line; do
            # from "../../something" or from '../../../something'
            imp=$(echo "$line" | sed -n 's/.*from ["'\'']\(\.\.\/\.\.\/[^"'\'']*\)["'\''].*/\1/p')
            [[ -z "$imp" ]] && continue
            # Resolve relative to modules/<mod>/src/
            # ../../_shared/foo -> modules/_shared/foo
            base=$(echo "$imp" | sed 's|^\.\./\.\./||')
            # try .ts then plain
            if [[ -f "vivijure/modules/$base.ts" || -f "vivijure/modules/$base" || -f "vivijure/modules/$base/index.ts" ]]; then
              continue
            fi
            echo "local#295: modules entrypoint imports '$imp' which is not present under the pinned modules/ tree" >&2
            echo "local#295: failing checkout preflight so this does not look like a random vitest bug on the next PR." >&2
            echo "local#295: either the pin is incomplete for this SHA, or cf added a path outside modules/." >&2
            exit 1
          done < <(grep -hE 'from ["'\'']\.\./\.\./' vivijure/modules/keyframe/src/index.ts vivijure/modules/own-gpu/src/index.ts || true)
          echo "local#295: quality-tier cf checkout preflight OK (keyframe + own-gpu + escaped relative imports)"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            vivijure-local/package-lock.json
            vivijure-core/package-lock.json
      - name: Install vivijure-core
        working-directory: vivijure-core
        run: npm ci && npm run build
      - name: Install vivijure-local
        working-directory: vivijure-local
        run: npm ci --no-audit --no-fund
      - name: Select and run tests
        id: select
        working-directory: vivijure-local
        run: |
          set -euo pipefail
          ran=0
          if [ -f package.json ]; then
            if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
              npm ci
            else
              npm install --no-audit --no-fund
            fi
            has() { node -e 'const s=(require("./package.json").scripts)||{}; process.exit(typeof s[process.argv[1]]==="string"&&s[process.argv[1]].trim()!==""?0:1)' "$1"; }
            if has coverage; then
              echo "coverage-standard: EXECUTED npm run coverage"
              npm run coverage
              ran=1
            elif has test; then
              echo "coverage-standard: EXECUTED npm test"
              npm test
              ran=1
            else
              echo "::error::package.json defines neither a coverage nor a test script. Add one, or declare an exemption in .github/coverage-exempt."
              [ -f .github/coverage-exempt ] || exit 1
            fi
          fi
          if [ -f go.mod ]; then
            echo "coverage-standard: EXECUTED go test ./... -cover"
            go test ./... -cover
            ran=1
          fi
          if [ "$ran" -eq 0 ]; then
            if [ -f .github/coverage-exempt ]; then
              reason="$(tr -s '[:space:]' ' ' < .github/coverage-exempt)"
              if [ "${#reason}" -lt 40 ]; then
                echo "::error::.github/coverage-exempt reason is ${#reason} characters, minimum 40. A label is not a reason."
                exit 1
              fi
              echo "coverage-standard: EXEMPT (declared): ${reason}"
            else
              echo "::error::nothing to run (no runnable package.json, no go.mod) and no .github/coverage-exempt. An unanswered coverage question is not a pass."
              exit 1
            fi
          fi

      - name: Sidecar allowlist
        working-directory: vivijure-local
        run: python3 containers/cast-image/test_allowlist.py
