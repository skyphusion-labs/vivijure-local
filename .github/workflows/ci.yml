name: ci

# Typecheck + test + module conformance on every push and PR. Required check name is
# `ci` (aviation-grade ruleset); typecheck is a step inside this job, not a separate check.
# vivijure-local is PUBLIC; runs on GitHub-hosted ubuntu-latest (fork-safe).
#
# Installs @skyphusion-labs/vivijure-core and @skyphusion-labs/vivijure-mcp from npm.
# Sibling vivijure-core checkout remains for conformance + core typecheck/test scripts;
# vivijure sparse checkout for quality-tier-drift in core's vitest.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: vivijure-local
      - name: Checkout vivijure-core
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-core
          path: vivijure-core
          # local CI runs core's OWN suite, which includes a guard comparing package.json
          # against the `vivijure-core-v*` tags. Without tags that guard sees an empty tag
          # set and REFUSES rather than passing -- correctly, because a tag comparison with
          # no tags is a vacuous green. The refusal is the guard working; the missing tags
          # were ours. Its message says so in terms: "CI must fetch-tags and local clones
          # need git fetch --tags or this guard is a vacuous green".
          #
          # This is the same class as local#295 / local#313 arriving through the CORE
          # sibling checkout rather than through vivijure-cf: a change in another repo
          # reddens every PR here with no change on this side. It is not a pin, because the
          # remedy is giving the guard its inputs, not freezing the repo it lives in.
          fetch-tags: true
          fetch-depth: 0
      - name: Checkout vivijure-cf (quality-tier-drift module manifests)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/vivijure-cf
          path: vivijure
          # EVERY PATH THESE TWO MODULES IMPORT HAS TO BE IN THIS LIST, not just the module dirs.
          # A sparse checkout that misses one does not fail at checkout; it fails later as
          # ERR_MODULE_NOT_FOUND inside a test, reading like our bug rather than a missing file.
          # modules/_shared is imported by BOTH (`../../_shared/runpod-job-log`, keyframe
          # src/index.ts:27 and own-gpu src/index.ts:28) and its absence reds every PR in this repo.
          # Before trimming this list, grep the checked-out modules for relative imports that
          # escape their own directory.
          sparse-checkout: |
            modules/keyframe
            modules/own-gpu
            modules/_shared
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            vivijure-local/package-lock.json
            vivijure-core/package-lock.json
      - name: Install vivijure-core
        working-directory: vivijure-core
        run: npm ci && npm run build
      - name: Install vivijure-local
        working-directory: vivijure-local
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: vivijure-local
        run: npm run typecheck
      - name: Test
        working-directory: vivijure-local
        run: npm test
      - name: Module conformance
        working-directory: vivijure-local
        run: npm run conformance
