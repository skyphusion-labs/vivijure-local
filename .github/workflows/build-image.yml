name: build-image

# Build compose images on GitHub-hosted runners. PRs and merges to main =
# build-only smoke (:ci tag, no push). A pushed version tag (v*) publishes GHCR
# :latest + :X.Y.Z (v prefix stripped; matches RunPod sibling image tags) for
# homelab compose pull. A merge to main never publishes; release deliberately
# with git tag -a vX.Y.Z && git push origin vX.Y.Z. :latest is the compose
# default (VJ_IMAGE_TAG) and only moves when a release tag is cut.
#
# Studio image installs @skyphusion-labs/vivijure-core and vivijure-mcp from npm.
#
# RUNNER PLANE (2026-09-25): every build job runs on GitHub-hosted `ubuntu-latest`,
# unconditionally. Until now the three build jobs carried a ternary that picked
# `ubuntu-latest` on a pull_request and `[self-hosted, bake-capable]` on anything else.
# The self-hosted fleet was decommissioned 2026-09-24 (cost), so the non-PR branch of that
# ternary resolved to a label set with no runners: the job did not fail, it QUEUED forever
# with no error anywhere, and only on main and on tags, which is the publish path. The PR
# branch kept passing, so a grep for `runs-on: [self-hosted` never saw it and every PR
# check stayed green. The ternary is collapsed to the plain label rather than kept, because
# the alternative it selected between no longer exists.
#
# This is safe to collapse and it is measured, not assumed: the PR branch has been building
# these same images from the same Dockerfiles on `ubuntu-latest` all along (run 35505840247,
# 2026-09-20: studio 75s, caddy 180s, and all five cpu-* matrix legs 60-128s, all success).
# A tag build differs only by `push: true`.
#
# The `sync-gpu-allowlist` job that used to run here was REMOVED 2026-09-25 (runner-group
# retirement lane, CR fleet-chezmoi#2160). It appended this repo's tag refs to the
# `vivijure-gpu-builds` org runner group (id 9), the Plane C bake pool, which has had ZERO
# runners since the 2026-09-24 fleet decommission. Its sync script was deleted from
# fleet-chezmoi the same day (commit 0b5c8b4), so the job could no longer even succeed: it
# would fail on the missing file and, through `needs`, SKIP the assert-on-main gate and every image job below. The group's 119
# workflow refs and 8 repo pinnings are preserved untouched, so standing Plane C back up
# re-adds this sync as part of provisioning the pool. Do not re-add it here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - compose.yaml
      - containers/**
      - reverse-proxy/**
      - package.json
      - package-lock.json
      - .github/workflows/build-image.yml
      - docs/FINISH_BACKEND.md

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/skyphusion-labs

jobs:
  # SECURITY GATE (fc#859): a v* tag can point at ANY commit, including one that never merged.
  # The org tag ruleset enforces deletion + non_fast_forward only, so `git tag v9.9.9 <unmerged>
  # && git push origin v9.9.9` would PUBLISH GHCR :latest + :X.Y.Z images from unreviewed code
  # (all three build jobs push on a tag), routing around branch protection. The three publish
  # jobs now `needs: assert-on-main`.
  #
  # The assertion runs only on a tag ref (step-level `if`), because a tag is this repo's ONLY
  # publish path -- there is no workflow_dispatch, and branch/PR runs are build-only (:ci, push
  # false). The JOB itself is NOT job-level gated: it always runs and SUCCEEDS on non-tag (the
  # single step is skipped), so the downstream `needs` is satisfied and build-only PR/merge CI
  # is never blocked. A job-level `if` here would SKIP this job on non-tag and, through `needs`,
  # skip the builds too.
  assert-on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assert published commit is on main (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$head" origin/main; then
            echo "::error::commit ${head} is not on origin/main; refusing to publish an unreviewed image"
            exit 1
          fi
          echo "commit ${head} is on origin/main; ancestry guard passed."

      # local#257: the org tag ruleset lets ANY v* tag through; nothing here checked that the
      # tag matches the code it publishes. Mirrors vivijure-control-plane's tag-vs-version
      # preflight -- but that guard famously checked only package.json while the Worker served a
      # DIFFERENT file (src/version.ts): a guard that reads one file checks the label on the box,
      # not the contents. vivijure-local has no served version string (yet); today the version is
      # declared in exactly two places, package.json and CHANGELOG.md, and this step checks BOTH.
      # A third version-carrying file added later (a served /version route, a compose label) must
      # be added here too.
      - name: Tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg} -- refusing to publish a mislabelled build"
            exit 1
          fi
          if ! grep -qF "## v${pkg}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v${pkg}' entry -- refusing to publish an undocumented release"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches declared version ${pkg}, documented in CHANGELOG.md."

  studio-image:
    needs: assert-on-main
    # local#255: needs alone does not stop a skipped assert-on-main from propagating a skip
    # down the chain (it happened here via sync-gpu-allowlist on PRs); state success explicitly.
    if: always() && needs.assert-on-main.result == 'success'
    name: studio
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: vivijure-local

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          image="${REGISTRY}/vivijure-local-studio"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Published image tag is clean SemVer (no v). Git tag stays vX.Y.Z;
            # GHCR tag is X.Y.Z so VJ_IMAGE_TAG=1.2.0 matches sibling RunPod pins
            # (vivijure#789 / vivijure-local#125).
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "${image}:latest"
              echo "${image}:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build studio image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: vivijure-local
          file: vivijure-local/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  caddy-image:
    needs: assert-on-main
    # local#255: needs alone does not stop a skipped assert-on-main from propagating a skip
    # down the chain (it happened here via sync-gpu-allowlist on PRs); state success explicitly.
    if: always() && needs.assert-on-main.result == 'success'
    name: caddy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: vivijure-local

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          image="${REGISTRY}/vivijure-local-caddy"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Published image tag is clean SemVer (no v). Git tag stays vX.Y.Z;
            # GHCR tag is X.Y.Z so VJ_IMAGE_TAG=1.2.0 matches sibling RunPod pins
            # (vivijure#789 / vivijure-local#125).
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "${image}:latest"
              echo "${image}:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Caddy edge image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: vivijure-local/reverse-proxy
          file: vivijure-local/reverse-proxy/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # finish-rife-serve RETIRED (Conrad 2026-07-28): no local RIFE image in vivijure-local.
  # RIFE stays on the RunPod backend worker for vivijure-cf / opt-in RunPod finish only.

  cpu-images:
    needs: assert-on-main
    # local#255: needs alone does not stop a skipped assert-on-main from propagating a skip
    # down the chain (it happened here via sync-gpu-allowlist on PRs); state success explicitly.
    if: always() && needs.assert-on-main.result == 'success'
    name: cpu-${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - video-finish
          - image-prep
          - audio-beat-sync
          - audio-mix
          - audio-master
    steps:
      - uses: actions/checkout@v7
        with:
          path: vivijure-local

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        env:
          CPU_IMAGE: ${{ matrix.image }}
        run: |
          image="${REGISTRY}/vivijure-local-${CPU_IMAGE}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Published image tag is clean SemVer (no v). Git tag stays vX.Y.Z;
            # GHCR tag is X.Y.Z so VJ_IMAGE_TAG=1.2.0 matches sibling RunPod pins
            # (vivijure#789 / vivijure-local#125).
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "${image}:latest"
              echo "${image}:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CPU container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: ./vivijure-local/containers/${{ matrix.image }}
          file: ./vivijure-local/containers/${{ matrix.image }}/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
