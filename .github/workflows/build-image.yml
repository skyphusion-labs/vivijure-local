name: build-image

# Build compose images on GitHub-hosted runners. PRs and merges to main =
# build-only smoke (:ci tag, no push). A pushed version tag (v*) publishes GHCR
# :latest + :X.Y.Z (v prefix stripped; matches RunPod sibling image tags) for
# homelab compose pull. A merge to main never publishes; release deliberately
# with git tag -a vX.Y.Z && git push origin vX.Y.Z. :latest is the compose
# default (VJ_IMAGE_TAG) and only moves when a release tag is cut.
#
# Studio image installs @skyphusion-labs/vivijure-core and vivijure-mcp from npm.
# Tag bakes sync the org GPU allowlist on ubuntu-latest before scheduling here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - compose.yaml
      - containers/**
      - reverse-proxy/**
      - package.json
      - package-lock.json
      - .github/workflows/build-image.yml
      - docs/FINISH_BACKEND.md

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/skyphusion-labs

jobs:
  # Inline sync (not workflow_call): public repos cannot call reusable workflows in
  # internal fleet-chezmoi (workflow validation fails with 0 jobs).
  sync-gpu-allowlist:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fleet-chezmoi (sync script)
        uses: actions/checkout@v7
        with:
          repository: skyphusion-labs/fleet-chezmoi
          ref: main
          token: ${{ secrets.RUNNER_GROUP_ADMIN_TOKEN }}

      - name: Sync vivijure-gpu-builds allowlist
        env:
          GH_TOKEN: ${{ secrets.RUNNER_GROUP_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          bash scripts/sync-vivijure-gpu-builds-allowlist.sh \
            --apply \
            --ensure-tag "vivijure-local" "${{ github.ref_name }}"

  # SECURITY GATE (fc#859): a v* tag can point at ANY commit, including one that never merged.
  # The org tag ruleset enforces deletion + non_fast_forward only, so `git tag v9.9.9 <unmerged>
  # && git push origin v9.9.9` would PUBLISH GHCR :latest + :X.Y.Z images from unreviewed code
  # (all three build jobs push on a tag), routing around branch protection. The three publish
  # jobs now `needs: assert-on-main`.
  #
  # The assertion runs only on a tag ref (step-level `if`), because a tag is this repo's ONLY
  # publish path -- there is no workflow_dispatch, and branch/PR runs are build-only (:ci, push
  # false). The JOB itself is NOT job-level gated: it always runs and SUCCEEDS on non-tag (the
  # single step is skipped), so the downstream `needs` is satisfied and build-only PR/merge CI
  # is never blocked. A job-level `if` here would SKIP this job on non-tag and, through `needs`,
  # skip the builds too.
  assert-on-main:
    needs: sync-gpu-allowlist
    if: always() && (needs.sync-gpu-allowlist.result == 'success' || needs.sync-gpu-allowlist.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Assert published commit is on main (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          head="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$head" origin/main; then
            echo "::error::commit ${head} is not on origin/main; refusing to publish an unreviewed image"
            exit 1
          fi
          echo "commit ${head} is on origin/main; ancestry guard passed."

      # local#257: the org tag ruleset lets ANY v* tag through; nothing here checked that the
      # tag matches the code it publishes. Mirrors vivijure-control-plane's tag-vs-version
      # preflight -- but that guard famously checked only package.json while the Worker served a
      # DIFFERENT file (src/version.ts): a guard that reads one file checks the label on the box,
      # not the contents. vivijure-local has no served version string (yet); today the version is
      # declared in exactly two places, package.json and CHANGELOG.md, and this step checks BOTH.
      # A third version-carrying file added later (a served /version route, a compose label) must
      # be added here too.
      - name: Tag matches the declared version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg} -- refusing to publish a mislabelled build"
            exit 1
          fi
          if ! grep -qF "## v${pkg}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v${pkg}' entry -- refusing to publish an undocumented release"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches declared version ${pkg}, documented in CHANGELOG.md."

  studio-image:
    needs: assert-on-main
    # local#255: needs alone does not stop a skipped assert-on-main from propagating a skip
    # down the chain (it happened here via sync-gpu-allowlist on PRs); state success explicitly.
    if: always() && needs.assert-on-main.result == 'success'
    name: studio
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "gpu"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: vivijure-local

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          image="${REGISTRY}/vivijure-local-studio"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Published image tag is clean SemVer (no v). Git tag stays vX.Y.Z;
            # GHCR tag is X.Y.Z so VJ_IMAGE_TAG=1.2.0 matches sibling RunPod pins
            # (vivijure#789 / vivijure-local#125).
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "${image}:latest"
              echo "${image}:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build studio image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: vivijure-local
          file: vivijure-local/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  caddy-image:
    needs: assert-on-main
    # local#255: needs alone does not stop a skipped assert-on-main from propagating a skip
    # down the chain (it happened here via sync-gpu-allowlist on PRs); state success explicitly.
    if: always() && needs.assert-on-main.result == 'success'
    name: caddy
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "gpu"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: vivijure-local

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          image="${REGISTRY}/vivijure-local-caddy"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Published image tag is clean SemVer (no v). Git tag stays vX.Y.Z;
            # GHCR tag is X.Y.Z so VJ_IMAGE_TAG=1.2.0 matches sibling RunPod pins
            # (vivijure#789 / vivijure-local#125).
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "${image}:latest"
              echo "${image}:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Caddy edge image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: vivijure-local/reverse-proxy
          file: vivijure-local/reverse-proxy/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  finish-rife-serve:
    needs: assert-on-main
    # local#255: needs alone does not stop a skipped assert-on-main from propagating a skip
    # down the chain (it happened here via sync-gpu-allowlist on PRs); state success explicitly.
    if: always() && needs.assert-on-main.result == 'success'
    name: finish-rife-serve
    # local#260: this CUDA overlay is ~60GB uncompressed (the cache-to comment below says so in
    # its own words, against a 10GB Actions cache limit), which no GitHub-hosted ubuntu-latest
    # disk can hold. Three attempts at disk-reclaim on GitHub-hosted (toolchain removal, then
    # relocating Docker to /mnt, then both plus a broader cleanup with survivability telemetry)
    # all failed identically -- reverted on this PR rather than left as dead disk-shuffling that
    # the next reader might mistake for load-bearing. What did NOT work is worth recording:
    # in-workflow telemetry cannot diagnose a runner-fatal ENOSPC. The runner dies hard enough
    # writing its OWN diagnostic log that the job log never finishes uploading (`gh run view
    # --log` and the jobs/logs API both return nothing for a crashed job, on all three
    # attempts), and `::notice::` workflow commands were not promoted to check-run annotations
    # either -- only the error-level ENOSPC annotation survived. There was never a fourth
    # free-disk variant that was going to fit 60GB into a 14GB root disk.
    #
    # THE FIX IS ROUTING, NOT RECLAIMING: Plane C (org group vivijure-gpu-builds,
    # propagandhi/fatmike) already builds this exact image successfully on the tag/publish
    # path. Same-repo PRs get routed there too, since the disk problem is identical on a PR
    # build. Push-to-main keeps its original GitHub-hosted routing unchanged (out of scope for
    # this issue, which is specifically about the PR path; flagged separately rather than
    # silently folded in here).
    #
    # FORK PRs MUST NEVER REACH PLANE C. This is a public repo; a fork PR is untrusted
    # Dockerfile content, and running it on our own GPU fleet hardware would be arbitrary code
    # execution on our own boxes. Fork PRs get ubuntu-latest instead, but get no real build
    # attempt there either -- ubuntu-latest still cannot fit this image, so the steps below
    # skip the actual work for a fork PR and say so LOUDLY (the local#255 lesson: a silent skip
    # reads as nothing happened; this one is not silent).
    runs-on: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || startsWith(github.ref, 'refs/tags/v')) && fromJSON('["self-hosted", "gpu"]') || 'ubuntu-latest' }}
    # 90, not 45: the uncached first bake of this CUDA overlay ran 45.3 and ~46 min into the v1.2.0
    # tag run's 45-minute budget and was killed by THIS timeout both times (reads as "cancelled" in
    # the UI, which cost a runner-defect investigation before anyone checked here). GHCR layer reuse
    # should bring later bakes down, but the budget must fit the cold case.
    timeout-minutes: 90
    steps:
      - name: Determine whether this is an untrusted fork PR
        id: fork_check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is_fork_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Fork PR: finish-rife-serve NOT built or verified this run"
        if: steps.fork_check.outputs.is_fork_pr == 'true'
        run: |
          echo "::warning title=finish-rife-serve skipped::This is a fork PR. finish-rife-serve (~60GB CUDA overlay) only builds on the self-hosted GPU lane (Plane C), which fork PRs must never reach (arbitrary code execution risk on fleet hardware from untrusted Dockerfile content). This run did NOT build or verify the image. It builds and verifies on same-repo branches/PRs, merges to main, and tag publishes."
          {
            echo "## :warning: finish-rife-serve was NOT built for this fork PR"
            echo ""
            echo "Fork PRs never reach the self-hosted GPU runner (Plane C, the sole vivijure image-bake lane) this ~60GB image needs. That is a security boundary, not an oversight -- untrusted Dockerfile content from a fork must never execute on fleet hardware. This job ran but built nothing; treat it as unverified, not as a pass."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: steps.fork_check.outputs.is_fork_pr == 'false'
        with:
          path: vivijure-local

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: steps.fork_check.outputs.is_fork_pr == 'false'

      - name: Log in to GHCR
        if: steps.fork_check.outputs.is_fork_pr == 'false' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        if: steps.fork_check.outputs.is_fork_pr == 'false'
        run: |
          image="${REGISTRY}/vivijure-local-finish-rife"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "${image}:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build finish-rife-serve overlay
        if: steps.fork_check.outputs.is_fork_pr == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: ./vivijure-local/containers/finish-rife-serve
          file: ./vivijure-local/containers/finish-rife-serve/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          # No cache-to here: this CUDA overlay's export is ~60GB against the 10GB Actions cache
          # limit, and the failed export killed the v1.2.1 publish (backend "not_found") AFTER the
          # image built. Layer reuse comes from GHCR, not the Actions cache.
          cache-from: type=gha

  cpu-images:
    needs: assert-on-main
    # local#255: needs alone does not stop a skipped assert-on-main from propagating a skip
    # down the chain (it happened here via sync-gpu-allowlist on PRs); state success explicitly.
    if: always() && needs.assert-on-main.result == 'success'
    name: cpu-${{ matrix.image }}
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted", "gpu"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - video-finish
          - image-prep
          - audio-beat-sync
          - audio-mix
          - audio-master
    steps:
      - uses: actions/checkout@v7
        with:
          path: vivijure-local

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        env:
          CPU_IMAGE: ${{ matrix.image }}
        run: |
          image="${REGISTRY}/vivijure-local-${CPU_IMAGE}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # Published image tag is clean SemVer (no v). Git tag stays vX.Y.Z;
            # GHCR tag is X.Y.Z so VJ_IMAGE_TAG=1.2.0 matches sibling RunPod pins
            # (vivijure#789 / vivijure-local#125).
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "${image}:latest"
              echo "${image}:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:ci" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CPU container image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: ./vivijure-local/containers/${{ matrix.image }}
          file: ./vivijure-local/containers/${{ matrix.image }}/Dockerfile
          push: ${{ steps.meta.outputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
