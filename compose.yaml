# vivijure-local -- one-command homelab stack
#
#   npm run install:studio   # mint token + seed platform_secrets
#   npm run compose:up       # pull GHCR :latest + docker compose up -d
#   npm run install:edge     # DNS checklist + Caddy site config for public HTTPS
#   COMPOSE_PROFILES=edge npm run compose:up   # + Caddy (studio + MinIO TLS)
#
# Images are built on push to main and published to GHCR (see build-image workflow).
# Override VJ_IMAGE_REGISTRY / VJ_IMAGE_TAG in .env to pin a different registry or tag.
# Private GHCR: docker login ghcr.io (read:packages) before compose:up.
#
# Studio UI:     http://127.0.0.1:8790  (or https via COMPOSE_PROFILES=edge; see docs/EDGE.md)
# MinIO console: http://127.0.0.1:9001  (localhost-only default minioadmin; edge refuses it)
# MinIO S3 API:  http://127.0.0.1:9000  (in-network); public HTTPS via Caddy + S3_PRESIGN_ENDPOINT
#               COMPOSE_PROFILES=edge requires non-placeholder S3_* (npm run install:edge mints them).
#
# Default homelab stack (Conrad ruling 2026-07-28 / local#265):
#   Ollama plan.enhance → unload → local-gpu keyframe (16GB door first). NO RunPod modules in default.
# CPU sidecars, VPC shims, score/chain modules, and Ollama run by default.
# Optional profiles (see docs/install-profiles.md):
#   localgpu   -- the GPU door module (+ LOCAL_BACKEND_URL / MODULE_LOCAL_GPU_URL)
#   cloud      -- RunPod keyframe, own-gpu, cloud i2v, cloud-keyframe, speech-upscale
#   satellites -- finish-lipsync, finish-upscale GPU sidecars (+ MODULE_LIPSYNC_URL / MODULE_UPSCALE_URL)
# `npm run install:studio` turns ONE answer (your door address) into all three localgpu values, so the
#   documented homelab path stays a single knob. No door: leave the lane off -- the module is then not
#   in the stack at all, and the studio says keyframe/motion are unavailable and why (local#280).
# FINISH_BACKEND defaults to local (LOCAL_FINISH_*_URL, docs/FINISH_BACKEND.md); RunPod is opt-in.

name: vivijure-local

networks:
  studio:
    driver: bridge

volumes:
  minio-data:
  studio-data:
  ollama-data:
  caddy-data:
  caddy-config:

x-cpu-health: &cpu-health
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

x-cpu-service: &cpu-service
  restart: unless-stopped
  networks: [studio]
  pull_policy: always
  environment:
    PORT: "8000"
    ALLOW_HTTP_FETCH: ${S3_ALLOW_HTTP_FETCH:-true}
    ALLOWED_FETCH_HOSTS: ${S3_FETCH_ALLOW_HOSTS:-minio}

x-module-sidecar: &module-sidecar
  image: ${VJ_IMAGE_REGISTRY:-ghcr.io/skyphusion-labs}/vivijure-local-studio:${VJ_IMAGE_TAG:-latest}
  pull_policy: always
  restart: unless-stopped
  networks: [studio]

x-module-health: &module-health
  interval: 5s
  timeout: 3s
  retries: 6
  start_period: 20s

x-cpu-module-env: &cpu-module-env
  DATABASE_PATH: /app/vivijure-local/data/studio.db

x-cpu-module: &cpu-module
  <<: *module-sidecar
  volumes:
    - studio-data:/app/vivijure-local/data:ro
  environment:
    <<: *cpu-module-env

x-runpod-module: &runpod-module
  <<: *module-sidecar
  volumes:
    - studio-data:/app/vivijure-local/data:ro
  environment:
    DATABASE_PATH: /app/vivijure-local/data/studio.db
    RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
    RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
    VIDEO_UPSCALE_RUNPOD_ENDPOINT_ID: ${VIDEO_UPSCALE_RUNPOD_ENDPOINT_ID:-}
    MUSETALK_RUNPOD_ENDPOINT_ID: ${MUSETALK_RUNPOD_ENDPOINT_ID:-}
    AUDIO_UPSCALE_RUNPOD_ENDPOINT_ID: ${AUDIO_UPSCALE_RUNPOD_ENDPOINT_ID:-}
    FINISH_BACKEND: ${FINISH_BACKEND:-local}
    FINISH_LIPSYNC_BACKEND: ${FINISH_LIPSYNC_BACKEND:-}
    FINISH_UPSCALE_BACKEND: ${FINISH_UPSCALE_BACKEND:-}
    LOCAL_FINISH_LIPSYNC_URL: ${LOCAL_FINISH_LIPSYNC_URL:-}
    LOCAL_FINISH_UPSCALE_URL: ${LOCAL_FINISH_UPSCALE_URL:-}
    LOCAL_FINISH_SPEECH_URL: ${LOCAL_FINISH_SPEECH_URL:-}
    LOCAL_FINISH_TOKEN: ${LOCAL_FINISH_TOKEN:-}
    # Sequential VRAM (local#265): finish sidecars unload Ollama before local GPU /run.
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    OLLAMA_PLAN_MODEL: ${OLLAMA_PLAN_MODEL:-qwen3:14b}
    # cf#61: pre-submit idle workersMax reconcile (backend/keyframe default 3, quota headroom on the backend render EP; id removed from tracked docs, scheduled for teardown per cf#215, see fleet-chezmoi runpod endpoints runbook; satellites override below)
    RUNPOD_WORKERS_MAX: ${RUNPOD_WORKERS_MAX:-3}
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    S3_BUCKET: vivijure
    S3_REGION: us-east-1
    S3_FORCE_PATH_STYLE: "true"

x-module-health-url: &module-health-url
  interval: 5s
  timeout: 3s
  retries: 6
  start_period: 20s

x-profile-cloud: &profile-cloud
  profiles: [cloud]

# local#280: the GPU door lane. Same shape as `cloud` / `satellites` / `edge` -- an optional lane is a
# named profile, so with the profile off the service is not in `docker compose config` at all.
x-profile-localgpu: &profile-localgpu
  profiles: [localgpu]

x-ai-gateway-env: &ai-gateway-env
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  GATEWAY_ID: ${GATEWAY_ID:-skyphusion-llm}
  CF_AIG_TOKEN: ${CF_AIG_TOKEN:-}

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      # Virtual-host S3 (vivijure.<domain>) for RunPod boto3 default; path-style still works for studio.
      # Set MINIO_PUBLIC_DOMAIN to your public MinIO hostname when using COMPOSE_PROFILES=edge.
      MINIO_DOMAIN: ${MINIO_PUBLIC_DOMAIN:-}
    volumes:
      - minio-data:/data
    networks: [studio]
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    networks: [studio]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
    volumes:
      - ./scripts/seed-minio-layout.sh:/seed-minio-layout.sh:ro
    entrypoint: ["/bin/sh", "/seed-minio-layout.sh"]
    restart: "no"

  video-finish:
    <<: *cpu-service
    image: ${VJ_IMAGE_REGISTRY:-ghcr.io/skyphusion-labs}/vivijure-local-video-finish:${VJ_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8780:8000"
    healthcheck:
      <<: *cpu-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]

  image-prep:
    <<: *cpu-service
    image: ${VJ_IMAGE_REGISTRY:-ghcr.io/skyphusion-labs}/vivijure-local-image-prep:${VJ_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8781:8000"
    healthcheck:
      <<: *cpu-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]

  audio-beat-sync:
    <<: *cpu-service
    image: ${VJ_IMAGE_REGISTRY:-ghcr.io/skyphusion-labs}/vivijure-local-audio-beat-sync:${VJ_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8782:8000"
    healthcheck:
      <<: *cpu-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]

  audio-mix:
    <<: *cpu-service
    image: ${VJ_IMAGE_REGISTRY:-ghcr.io/skyphusion-labs}/vivijure-local-audio-mix:${VJ_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8783:8000"
    healthcheck:
      <<: *cpu-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]

  audio-master:
    <<: *cpu-service
    image: ${VJ_IMAGE_REGISTRY:-ghcr.io/skyphusion-labs}/vivijure-local-audio-master:${VJ_IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8784:8000"
    healthcheck:
      <<: *cpu-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]

  # Homelab LLM for plan.enhance (local#265). Shares the GPU with the 16GB door serially:
  # plan → unload → keyframe. On NVIDIA hosts use compose.ollama-nvidia.yaml (see
  # docs/DEPLOYMENT.md); without it Ollama runs on CPU (fine for CI / Mac).
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [studio]
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot pull for default qwen3:14b (~9.3GB Q4; fits 16GB with headroom before unload).
  # First boot downloads the model; retries on transient registry errors; verifies with `show`.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    networks: [studio]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_PLAN_MODEL: ${OLLAMA_PLAN_MODEL:-qwen3:14b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        model="$$OLLAMA_PLAN_MODEL"
        echo "ollama-pull: ensuring $$model is present (first boot may download ~9GB)"
        i=1
        while [ "$$i" -le 5 ]; do
          if ollama pull "$$model"; then
            ollama show "$$model" >/dev/null
            echo "ollama-pull: $$model ready"
            exit 0
          fi
          echo "ollama-pull: attempt $$i failed; retrying in 8s"
          i=$$((i + 1))
          sleep 8
        done
        echo "ollama-pull: failed to pull $$model after retries" >&2
        exit 1
    restart: "no"

  # RunPod keyframe sidecar -- cloud profile only (not in default homelab stack).
  module-keyframe:
    <<: [*runpod-module, *profile-cloud]
    command: ["npx", "tsx", "scripts/runpod-module-server.ts", "9101", "keyframe"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9101/module.json"]

  # Fail-closed: the localgpu lane must not come up pointing at nothing.
  # Only reachable with COMPOSE_PROFILES=localgpu, so it fires exactly when the operator asked for the
  # door lane but left the door address blank -- the one inconsistency the profile gate cannot catch.
  #
  # It applies the SAME test as isDoorConfigured (src/localgpu-lane.ts): an absolute http(s) URL, not
  # merely a non-empty string. A `-z` test passed a malformed address like `vivijure-local-16gb:8000`
  # and left it to the sidecar's own exit 1 one layer later -- still fail-closed, but from the gate that
  # advertises itself as THE fail-closed check, and after the rest of the stack had already started.
  localgpu-door-gate:
    <<: *profile-localgpu
    image: busybox:1.36
    restart: "no"
    environment:
      LOCAL_BACKEND_URL: ${LOCAL_BACKEND_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        case "$$LOCAL_BACKEND_URL" in
          http://?*|https://?*) exit 0 ;;
        esac
        echo "REFUSING COMPOSE_PROFILES=localgpu without a usable LOCAL_BACKEND_URL." >&2
        echo "Set LOCAL_BACKEND_URL to your GPU door (vivijure-local-16gb / -12gb) in .env as an" >&2
        echo "absolute http(s) URL, e.g. http://vivijure-local-16gb:8000 (got: '$$LOCAL_BACKEND_URL')," >&2
        echo "or drop 'localgpu' from COMPOSE_PROFILES to run without a GPU door." >&2
        exit 1

  # GPU door module -- opt-in lane (COMPOSE_PROFILES=localgpu + LOCAL_BACKEND_URL + MODULE_LOCAL_GPU_URL).
  # `npm run install:studio` derives all three from the door address, so the operator sets one thing.
  #
  # local#280: with the lane off this service DOES NOT EXIST. It used to run in the default stack and
  # answer /module.json with `configured: false` about itself -- a process kept alive to describe its
  # own absence, which is not what absence looks like. An absent capability is absent.
  module-local-gpu:
    <<: [*cpu-module, *profile-localgpu]
    command: ["npx", "tsx", "scripts/local-gpu-module-server.ts", "9102"]
    depends_on:
      localgpu-door-gate:
        condition: service_completed_successfully
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9102/module.json"]
    environment:
      # 16GB door first (local#265). Override to 12gb hostname or host URL as needed.
      # REQUIRED in this lane: the gate above refuses the stack if it is empty, and the sidecar exits
      # at startup rather than boot as a doorless stand-in.
      LOCAL_BACKEND_URL: ${LOCAL_BACKEND_URL:-}
      LOCAL_BACKEND_TOKEN: ${LOCAL_BACKEND_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_PLAN_MODEL: ${OLLAMA_PLAN_MODEL:-qwen3:14b}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

  module-own-gpu:
    <<: [*runpod-module, *profile-cloud]
    command: ["npx", "tsx", "scripts/runpod-module-server.ts", "9103", "own-gpu"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9103/module.json"]

  module-finish-lipsync:
    <<: *runpod-module
    profiles: [satellites]
    environment:
      RUNPOD_WORKERS_MAX: "2"
    command: ["npx", "tsx", "scripts/finish-module-server.ts", "9111", "finish-lipsync"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9111/module.json"]

  module-finish-upscale:
    <<: *runpod-module
    profiles: [satellites]
    environment:
      RUNPOD_WORKERS_MAX: "2"
    command: ["npx", "tsx", "scripts/finish-module-server.ts", "9112", "finish-upscale"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9112/module.json"]

  module-seedance:
    <<: [*runpod-module, *profile-cloud]
    command: ["npx", "tsx", "scripts/runpod-module-server.ts", "9150", "seedance"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9150/module.json"]

  module-kling:
    <<: [*runpod-module, *profile-cloud]
    command: ["npx", "tsx", "scripts/runpod-module-server.ts", "9151", "kling"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9151/module.json"]

  module-google-veo:
    <<: [*runpod-module, *profile-cloud]
    command: ["npx", "tsx", "scripts/runpod-module-server.ts", "9152", "google-veo"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9152/module.json"]

  module-minimax-hailuo:
    <<: [*runpod-module, *profile-cloud]
    command: ["npx", "tsx", "scripts/runpod-module-server.ts", "9153", "minimax-hailuo"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9153/module.json"]

  module-vidu-q3:
    <<: [*runpod-module, *profile-cloud]
    command: ["npx", "tsx", "scripts/runpod-module-server.ts", "9154", "vidu-q3"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9154/module.json"]

  module-alibaba-wan:
    <<: [*runpod-module, *profile-cloud]
    command: ["npx", "tsx", "scripts/runpod-module-server.ts", "9155", "alibaba-wan"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9155/module.json"]

  module-alibaba-wan-lora:
    <<: [*runpod-module, *profile-cloud]
    command: ["npx", "tsx", "scripts/runpod-module-server.ts", "9156", "alibaba-wan-lora"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9156/module.json"]

  module-cloud-keyframe:
    <<: [*module-sidecar, *profile-cloud]
    volumes:
      - studio-data:/app/vivijure-local/data:ro
    command: ["npx", "tsx", "scripts/cloud-keyframe-module-server.ts", "9157"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9157/module.json"]
    environment:
      DATABASE_PATH: /app/vivijure-local/data/studio.db
      <<: *ai-gateway-env
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

  module-music-gen:
    <<: *module-sidecar
    volumes:
      - studio-data:/app/vivijure-local/data:ro
    command: ["npx", "tsx", "scripts/score-module-server.ts", "9158", "music-gen"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9158/module.json"]
    environment:
      DATABASE_PATH: /app/vivijure-local/data/studio.db
      <<: *ai-gateway-env
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

  module-narration-gen:
    <<: *module-sidecar
    volumes:
      - studio-data:/app/vivijure-local/data:ro
    command: ["npx", "tsx", "scripts/score-module-server.ts", "9159", "narration-gen"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9159/module.json"]
    environment:
      DATABASE_PATH: /app/vivijure-local/data/studio.db
      <<: *ai-gateway-env
      # local#209: narration-gen joins the DEFAULT stack. Deepgram Aura-1 on CF AI is the creds-free
      # default tier (local#202); RUNPOD_API_KEY activates the opt-in MiniMax HD tier. With neither set
      # it degrades honestly (never a broken button), so it is safe in the out-of-box no-RunPod film.
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

  module-beat-sync:
    <<: *cpu-module
    command: ["npx", "tsx", "scripts/cpu-module-server.ts", "9120", "beat-sync"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9120/module.json"]
    environment:
      <<: *cpu-module-env
      AUDIO_BEAT_SYNC_URL: http://audio-beat-sync:8000

  module-audio-master:
    <<: *cpu-module
    command: ["npx", "tsx", "scripts/cpu-module-server.ts", "9121", "audio-master"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9121/module.json"]
    environment:
      <<: *cpu-module-env
      AUDIO_MASTER_URL: http://audio-master:8000

  module-film-titles:
    <<: *cpu-module
    command: ["npx", "tsx", "scripts/cpu-module-server.ts", "9130", "film-titles"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9130/module.json"]
    environment:
      <<: *cpu-module-env
      VIDEO_FINISH_URL: http://video-finish:8000

  module-subtitle:
    <<: *cpu-module
    command: ["npx", "tsx", "scripts/cpu-module-server.ts", "9131", "subtitle"]
    healthcheck:
      <<: *module-health-url
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9131/module.json"]
    environment:
      <<: *cpu-module-env
      VIDEO_FINISH_URL: http://video-finish:8000

  module-plan-enhance:
    <<: *module-sidecar
    volumes:
      - studio-data:/app/vivijure-local/data:ro
    command: ["npx", "tsx", "scripts/chain-module-server.ts", "9140", "plan-enhance"]
    healthcheck:
      <<: *module-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9140/module.json"]
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    environment:
      DATABASE_PATH: /app/vivijure-local/data/studio.db
      # Offline/CI: PLANNER_AI_MOCK=true. Homelab real planning: false (default) + Ollama.
      PLANNER_AI_MOCK: ${PLANNER_AI_MOCK:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_PLAN_MODEL: ${OLLAMA_PLAN_MODEL:-qwen3:14b}
      # AI Gateway remains an opt-in overlay (explicit anthropic/* model ids).
      <<: *ai-gateway-env
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

  module-cast-image:
    <<: *module-sidecar
    volumes:
      - studio-data:/app/vivijure-local/data:ro
    command: ["npx", "tsx", "scripts/chain-module-server.ts", "9141", "cast-image"]
    healthcheck:
      <<: *module-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9141/module.json"]
    environment:
      DATABASE_PATH: /app/vivijure-local/data/studio.db
      <<: *ai-gateway-env
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

  # image.generate (cf#129): local's own declaring module for the chat image path. LOAD-BEARING for
  # the image catalog, not an extra -- the studio hardcodes no image model names, so GET /api/models
  # projects its image rows from this module. Unbound, the image picker is honestly empty.
  # Port 9145: 9140-9144 are the other chain modules, 9150+ the video ones.
  # NO S3/bucket env, deliberately: this module returns image BYTES and never writes storage. That is
  # what makes the cf#140 write/serve split structurally unreachable (the core owns persistence).
  module-image-generate:
    <<: *module-sidecar
    command: ["npx", "tsx", "scripts/chain-module-server.ts", "9145", "image-generate"]
    healthcheck:
      <<: *module-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9145/module.json"]
    environment:
      <<: *ai-gateway-env

  module-dialogue-gen:
    <<: *module-sidecar
    volumes:
      - studio-data:/app/vivijure-local/data:ro
    command: ["npx", "tsx", "scripts/chain-module-server.ts", "9142", "dialogue-gen"]
    healthcheck:
      <<: *module-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9142/module.json"]
    environment:
      DATABASE_PATH: /app/vivijure-local/data/studio.db
      <<: *ai-gateway-env
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

  module-speech-upscale:
    <<: *module-sidecar
    # local#383: `cloud` OR `satellites`. This sidecar used to be cloud-only because RunPod was its
    # only backend; it now also serves an on-box door, so it has to be startable in the lane where
    # the on-box doors run. Compose starts a service when ANY of its profiles is enabled, so the
    # cloud lane is unchanged and the default (no profile) still does not start it.
    profiles: [cloud, satellites]
    volumes:
      - studio-data:/app/vivijure-local/data:ro
    command: ["npx", "tsx", "scripts/chain-module-server.ts", "9143", "speech-upscale"]
    healthcheck:
      <<: *module-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9143/module.json"]
    environment:
      DATABASE_PATH: /app/vivijure-local/data/studio.db
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      AUDIO_UPSCALE_RUNPOD_ENDPOINT_ID: ${AUDIO_UPSCALE_RUNPOD_ENDPOINT_ID:-}
      LOCAL_FINISH_SPEECH_URL: ${LOCAL_FINISH_SPEECH_URL:-}
      LOCAL_FINISH_TOKEN: ${LOCAL_FINISH_TOKEN:-}
      RUNPOD_WORKERS_MAX: "2"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"

  module-notify-email:
    <<: *module-sidecar
    command: ["npx", "tsx", "scripts/chain-module-server.ts", "9144", "notify-email"]
    healthcheck:
      <<: *module-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9144/module.json"]

  studio:
    image: ${VJ_IMAGE_REGISTRY:-ghcr.io/skyphusion-labs}/vivijure-local-studio:${VJ_IMAGE_TAG:-latest}
    pull_policy: always
    ports:
      - "127.0.0.1:8790:8790"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8790"
      RENDER_SWEEP_INTERVAL_MS: ${RENDER_SWEEP_INTERVAL_MS:-60000}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8790}
      DATABASE_PATH: /app/vivijure-local/data/studio.db
      AUTH_MODE: ${AUTH_MODE:-token}
      STUDIO_API_TOKEN: ${STUDIO_API_TOKEN:-change-me-local-dev-only}
      PLANNER_AI_MOCK: ${PLANNER_AI_MOCK:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_PLAN_MODEL: ${OLLAMA_PLAN_MODEL:-qwen3:14b}
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: vivijure
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      VIDEO_FINISH_URL: http://video-finish:8000
      IMAGE_PREP_URL: http://image-prep:8000
      AUDIO_BEAT_SYNC_URL: http://audio-beat-sync:8000
      AUDIO_MIX_URL: http://audio-mix:8000
      AUDIO_MASTER_URL: http://audio-master:8000
      # RunPod env retained for opt-in cloud profile overlays only (unset in default homelab).
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      VIDEO_UPSCALE_RUNPOD_ENDPOINT_ID: ${VIDEO_UPSCALE_RUNPOD_ENDPOINT_ID:-}
      MUSETALK_RUNPOD_ENDPOINT_ID: ${MUSETALK_RUNPOD_ENDPOINT_ID:-}
      AUDIO_UPSCALE_RUNPOD_ENDPOINT_ID: ${AUDIO_UPSCALE_RUNPOD_ENDPOINT_ID:-}
      # Default documented door: vivijure-local-16gb (set in .env alongside COMPOSE_PROFILES=localgpu).
      LOCAL_BACKEND_URL: ${LOCAL_BACKEND_URL:-}
      LOCAL_BACKEND_TOKEN: ${LOCAL_BACKEND_TOKEN:-}
      # RunPod keyframe module is cloud-profile only; leave unset in default stack.
      MODULE_KEYFRAME_URL: ${MODULE_KEYFRAME_URL:-}
      # localgpu-profile only, same shape as MODULE_KEYFRAME_URL / MODULE_LIPSYNC_URL. It used to be
      # hardcoded to http://module-local-gpu:9102, which bound a module that may not be in the stack;
      # an empty MODULE_*_URL is skipped by moduleUrlsFromEnv, so no binding, so the registry simply
      # has no local-gpu module to offer (local#280). install:studio sets it with the door.
      MODULE_LOCAL_GPU_URL: ${MODULE_LOCAL_GPU_URL:-}
      MODULE_OWN_GPU_URL: ${MODULE_OWN_GPU_URL:-}
      MODULE_LIPSYNC_URL: ${MODULE_LIPSYNC_URL:-}
      MODULE_UPSCALE_URL: ${MODULE_UPSCALE_URL:-}
      MODULE_SEEDANCE_URL: ${MODULE_SEEDANCE_URL:-}
      MODULE_KLING_URL: ${MODULE_KLING_URL:-}
      MODULE_GOOGLE_VEO_URL: ${MODULE_GOOGLE_VEO_URL:-}
      MODULE_MINIMAX_HAILUO_URL: ${MODULE_MINIMAX_HAILUO_URL:-}
      MODULE_VIDU_Q3_URL: ${MODULE_VIDU_Q3_URL:-}
      MODULE_ALIBABA_WAN_URL: ${MODULE_ALIBABA_WAN_URL:-}
      MODULE_ALIBABA_WAN_LORA_URL: ${MODULE_ALIBABA_WAN_LORA_URL:-}
      MODULE_CLOUD_KEYFRAME_URL: ${MODULE_CLOUD_KEYFRAME_URL:-}
      MODULE_MUSIC_GEN_URL: http://module-music-gen:9158
      MODULE_NARRATION_GEN_URL: http://module-narration-gen:9159
      MODULE_BEAT_SYNC_URL: http://module-beat-sync:9120
      MODULE_AUDIO_MASTER_URL: http://module-audio-master:9121
      MODULE_FILM_TITLES_URL: http://module-film-titles:9130
      MODULE_SUBTITLE_URL: http://module-subtitle:9131
      MODULE_PLANENHANCE_URL: http://module-plan-enhance:9140
      MODULE_CAST_IMAGE_URL: http://module-cast-image:9141
      MODULE_DIALOGUE_URL: http://module-dialogue-gen:9142
      MODULE_IMAGE_GENERATE_URL: http://module-image-generate:9145
      MODULE_SPEECH_UPSCALE_URL: ${MODULE_SPEECH_UPSCALE_URL:-}
      MODULE_NOTIFY_EMAIL_URL: http://module-notify-email:9144
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - studio-data:/app/vivijure-local/data
    networks: [studio]
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
      video-finish:
        condition: service_healthy
      image-prep:
        condition: service_healthy
      audio-beat-sync:
        condition: service_healthy
      audio-mix:
        condition: service_healthy
      audio-master:
        condition: service_healthy
      ollama:
        condition: service_healthy
      # No module-local-gpu here (local#280). The studio must start on a box with no GPU door, so it
      # cannot wait on a service that only exists in the localgpu lane. Modules are discovered over
      # HTTP at request time from MODULE_*_URL, not required at boot.
      module-plan-enhance:
        condition: service_healthy
      module-cast-image:
        condition: service_healthy
      module-image-generate:
        condition: service_healthy
      module-audio-master:
        condition: service_healthy
      module-beat-sync:
        condition: service_healthy
      module-film-titles:
        condition: service_healthy
      module-subtitle:
        condition: service_healthy
      module-dialogue-gen:
        condition: service_healthy
      module-music-gen:
        condition: service_healthy
      module-narration-gen:
        condition: service_healthy
      module-notify-email:
        condition: service_healthy

  # Fail-closed: public edge must not start with default minioadmin root creds.
  # Localhost compose (no edge profile) may keep minioadmin; install:edge mints S3_*.
  edge-minio-creds-gate:
    profiles: [edge]
    image: busybox:1.36
    restart: "no"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$S3_ACCESS_KEY_ID" ] || [ -z "$$S3_SECRET_ACCESS_KEY" ] \
          || [ "$$S3_ACCESS_KEY_ID" = "minioadmin" ] || [ "$$S3_SECRET_ACCESS_KEY" = "minioadmin" ]; then
          echo "REFUSING COMPOSE_PROFILES=edge with default MinIO credentials (minioadmin)." >&2
          echo "Run: npm run install:edge   (or set non-placeholder S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY)" >&2
          exit 1
        fi
        exit 0

  caddy:
    # Public HTTPS edge (Let's Encrypt). Opt-in: COMPOSE_PROFILES=edge.
    # Terminates TLS for the studio host and MinIO (including *.minio-host wildcard for S3
    # virtual-hosted buckets). Image includes several caddy-dns modules; pick one with
    # CADDY_DNS_PROVIDER / npm run install:edge. Full guide: docs/EDGE.md.
    profiles: [edge]
    build: ./reverse-proxy
    image: ${VJ_IMAGE_REGISTRY:-ghcr.io/skyphusion-labs}/vivijure-local-caddy:${VJ_IMAGE_TAG:-latest}
    pull_policy: build
    restart: unless-stopped
    networks: [studio]
    # EDGE_BIND_IP: host address for :80/:443 (default all interfaces). Homelabbers usually leave
    # the default. Behind an L4 load balancer, set this to the private/VLAN IP only.
    ports:
      - "${EDGE_BIND_IP:-0.0.0.0}:443:443"
      - "${EDGE_BIND_IP:-0.0.0.0}:80:80"
    environment:
      CADDY_APP_HOST: ${CADDY_APP_HOST:-localhost}
      CADDY_MINIO_HOST: ${CADDY_MINIO_HOST:-}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
      CADDY_DNS_PROVIDER: ${CADDY_DNS_PROVIDER:-cloudflare}
      # DNS-01 API tokens (set the ones for your provider; keep out of git)
      CF_DNS_TOKEN: ${CF_DNS_TOKEN:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID:-}
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}
      GCP_PROJECT: ${GCP_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      OVH_ENDPOINT: ${OVH_ENDPOINT:-}
      OVH_APPLICATION_KEY: ${OVH_APPLICATION_KEY:-}
      OVH_APPLICATION_SECRET: ${OVH_APPLICATION_SECRET:-}
      OVH_CONSUMER_KEY: ${OVH_CONSUMER_KEY:-}
      # Only if your L4 LB sends PROXY protocol: trusted source CIDR.
      CADDY_PROXY_ALLOW: ${CADDY_PROXY_ALLOW:-}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./reverse-proxy/sites.runtime.caddyfile:/etc/caddy/sites.caddyfile:ro
      - ./reverse-proxy/certs:/certs:ro
    depends_on:
      edge-minio-creds-gate:
        condition: service_completed_successfully
      studio:
        condition: service_started
      minio:
        condition: service_started
